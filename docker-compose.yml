services:
  datahub:
    build: .
    image: datahub:latest
    container_name: datahub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required in production
      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-string}"
      NODE_ENV: production
      # Public URL used in share links (set to your domain, e.g. https://hub.example.com)
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      # Persisted inside the volume below
      STORAGE_DIR: /app/data/storage
      DB_PATH: /app/data/datahub.db
      # Limits
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-10}"
      MAX_USER_QUOTA_MB: "${MAX_USER_QUOTA_MB:-100}"
      LINK_EXPIRY_DAYS: "${LINK_EXPIRY_DAYS:-7}"
    volumes:
      - datahub_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  datahub_data:
    driver: local